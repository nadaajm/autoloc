spring.application.name=autoloc-api
server.port=8081


# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db2?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

# Server configuration (chapitre 6)
server.servlet.context-path=/autoloc

# Nécessaire pour sérialiser en JSON les relations LAZY dans les contrôleurs
spring.jpa.open-in-view=true
